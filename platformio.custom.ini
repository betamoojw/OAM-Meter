;
; global custom
;

[RP2040_FLASH]
build_flags =
  -D KNX_FLASH_SIZE=0xC000
  -D KNX_FLASH_OFFSET=0xEC000
  -D OPENKNX_FLASH_SIZE=0x4000
  -D OPENKNX_FLASH_OFFSET=0xF8000

[custom]
build_flags =
  -D OPENKNX_WATCHDOG
  ; -D OPENKNX_DEBUGGER
  -D OPENKNX_LOOPTIME_WARNING=100
  ; -D OPENKNX_DUALCORE
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

[custom_net]
build_flags =
  -D OPENKNX_WEBSERVER
  -D OPENKNX_WEBCONSOLE
  -D OPENKNX_PING
  -D OPENKNX_WEBFS
  -D OPENKNX_MQTT
  -D OPENKNX_WEBCLIENT
  -D OPENKNX_WEBMONITOR

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_DEBUG
  ; -D OPENKNX_DEBUGGER
  ; -D OPENKNX_RUNTIME_STAT
  ; -D OPENKNX_RUNTIME_STAT_BUCKETN=7
  ; "-D OPENKNX_RUNTIME_STAT_BUCKETS=100, 200, 500, 1000, 2000, 5000"
  ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  "-D OPENKNX_TRACE=Meter;VirtualButton;BasicBinaryInput"

[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; RP2040
[RP2040_custom]
extends = RP2040, custom
build_flags =
  -D SERIAL_DEBUG=Serial

[env:develop_RP2040]
extends = RP2040_develop, RP2040_custom, custom_develop, RP2040_EXCHANGE_16MB
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
  ${RP2040_EXCHANGE_16MB.build_flags}
  ; -D DEVICE_REG1_BASE_V1
  ; -D DEVICE_REG1_SEN_MULTI
  ; -D OPENKNX_DUALCORE
  ; -D DEVICE_PIPICO_BCU_CONNECTOR
  ; -D DEVICE_SMARTMF_2SML_3BE

[env:develop_RP2040_JLINK]
extends = env:develop_RP2040, UPLOAD_JLINK

; ESP32
[ESP32_custom]
extends = ESP32, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  ${custom_net.build_flags}
  -D OPENKNX_USB_EXCHANGE_IGNORE
  -D BOARD_HAS_PSRAM

; Releases
